name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install (Python from .python-version, locked dependencies)
        run: uv sync --locked
      - name: Install IBKR's ibapi (downloaded from IBKR, SHA-256 checked)
        run: uv run python scripts/install_ibapi.py
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy --strict
      - name: Pytest
        env:
          FOOTPRINT_REQUIRE_IBAPI: "1"  # the binding's tests must run, never skip
        run: uv run pytest
