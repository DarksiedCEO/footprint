# Contract choice and order handling. Every number lives here, never in code.
# Values marked DEFAULT were not fixed by the spec; Andre may change them.
quotes:
  max_age_seconds: 5          # DEFAULT: an option quote older than this is not traded on
contract:
  max_spread_pct_of_mid: 5    # G3: skip if (ask - bid) is more than this % of the mid
  min_open_interest: 100      # G3: UNCALIBRATED placeholder; calibrate from chain data
  max_strike_distance: 50     # DEFAULT: skip if the nearest strike is further than this
                              # many points from the underlying (a gappy chain)
entry:
  step_ticks: 1               # G5: start at mid, step this many ticks toward the ask
  step_seconds: 5             # G5: ... this often
  max_steps: 4                # G5: ... at most this many times
  timeout_seconds: 30         # G5: cancel if still unfilled after this long
  max_over_mid_pct_of_spread: 25  # G5: never pay more than mid + this % of the spread
stop_order:
  limit_offset_ticks: 20      # G1 DEFAULT: resting stop-limit's limit sits this many ticks
                              # below its trigger; the watchdog flattens if price gaps
                              # through the limit
news:
  time_stop_minutes: 10       # spec: a news-window trade not up time_stop_min_gain after
  time_stop_min_gain: 250     #   this many minutes is closed
  window_minutes: 13          # spec: the news entry window runs this long after the
                              #   blackout ends (5:32 to 5:45 PT for an 8:30 ET print)
runner:
  max_unmanaged_seconds: 30   # DEFAULT: an open position that has not been managed for
                              #   this long (inputs failing, step crashing) is flattened
                              #   through the broker alone
reconcile:
  settle_seconds: 2           # DEFAULT: a broker/ledger mismatch, and what is held after
                              #   the cancels, must hold still this long before reconcile
                              #   acts (a live broker's position report can lag its fills)
  max_settle_seconds: 10      # DEFAULT: a broker report that will not hold still this
                              #   long escalates to Andre and halts (it is never acted on
                              #   unsettled: any sell on an untrusted report could go short)
  cancel_escalate_seconds: 10 # DEFAULT: a cancel unconfirmed this long escalates to Andre
                              #   ("flatten by hand"); reconcile still sells what the stuck
                              #   orders cannot cover
alarms:
  retry_seconds: 5            # DEFAULT: wait between tries while the alarm line is down
  max_pending: 500            # DEFAULT: alarms kept while the line is down; beyond this
                              #   the oldest are dropped and the count is reported
ibkr:
  ack_timeout_seconds: 5      # DEFAULT: wait this long for IBKR's answer to a send, modify
                              #   or cancel before treating the answer as lost
  positions_disagree_alarm_seconds: 10  # DEFAULT: IBKR's position report and the fills
                              #   disagreeing this long is alarmed and resynced (meanwhile no
                              #   position is reported at all); a resync not complete after
                              #   this long is alarmed
  reconnect_seconds: 15       # DEFAULT: wait between attempts to reach IB Gateway after
                              #   the connection drops (each attempt is followed by a full
                              #   resync before anything is sent)
  option_security_type: FOP   # IBKR's security type for the instrument's options; the
                              #   system sees nothing else in the account
  require_paper: true         # SAFETY: refuse to connect unless the account is a paper
                              #   account. Changing this to false is going live: Andre only
  paper_account_prefix: DU    # IBKR paper account ids begin with this
market_data:
  history_days: 35            # DEFAULT: calendar days of 1-minute bars loaded at start (the
                              #   readers look back 20 sessions; 35 days covers holidays)
  roll_days_before_expiry: 8  # DEFAULT: trade the next quarterly future from this many
                              #   calendar days before the front one expires (CME's usual
                              #   volume roll); older history is spliced and price-adjusted
  bar_poll_delay_seconds: 5   # DEFAULT: ask for the finished minute bar this long after the
                              #   minute closes (IBKR's last trades need a moment to land)
  min_poll_seconds: 300       # DEFAULT: each poll asks for at least this much recent
                              #   history (more after a gap, so a reconnect heals itself)
  history_request_gap_seconds: 2  # DEFAULT: wait between historical data requests (IBKR
                              #   pacing: no more than 6 alike in 2 seconds, 60 in 10 minutes)
  request_timeout_seconds: 30 # DEFAULT: a lookup or history request unanswered this long is
                              #   dropped and tried again later
  retry_seconds: 60           # DEFAULT: wait before retrying a failed request or a quote
                              #   stream IBKR refused (e.g. no subscription: error 354)
  strike_window_points: 100   # DEFAULT: stream option strikes this close to the future;
                              #   must cover contract.max_strike_distance + recenter_points
  recenter_points: 25         # DEFAULT: move the strike window once the future has moved
                              #   this far from where the window was centred
  max_quote_lines: 80         # DEFAULT: never hold more market data lines than this (IBKR
                              #   allows 100 by default; the future takes one)
