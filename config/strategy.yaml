# Reader settings. Every strategy number lives here, never in code.
# Values marked DEFAULT were not fixed by the spec; Andre may change them.
trend:
  timeframe_minutes: 15
  ema_fast: 9
  ema_slow: 21
  swing_strength: 2          # DEFAULT: a swing high/low needs this many bars on each side
volume:
  timeframe_minutes: 1
  lookback_sessions: 20      # same time-of-day bars averaged for relative volume
  spike_multiple: 3          # DEFAULT: spec says ~3-4x; start at the low end
range:
  adr_days: 10
  quiet_below_pct: 70
  extended_above_pct: 100
  chase_zone_pct: 10         # entering in this outer % of today's range, in the trade's
                             # direction, on a day already past quiet_below_pct, scores -1
data:
  max_bar_age_seconds: 120   # DEFAULT: newest completed 1-min bar older than this = feed stale
  min_session_coverage_pct: 90  # DEFAULT: a session with fewer minutes than this is unusable
  max_gap_minutes: 5         # DEFAULT: a longer run of missing minutes inside a session,
                             # or at its open/close, makes the session unusable
levels:
  # Round numbers are reported but are NOT walls (deviation, Andre to decide): while N is
  # larger than the instrument's round-number spacing, the next round number is always
  # inside the target and every trade would be vetoed.
  # N = points of underlying move needed for the profit target (see options.assumed_delta).
  room_multiple: 1.5         # nearest opposing level >= this many N away: full support
  wall_multiple: 1           # nearest opposing level closer than this many N: veto
  swing_lookback_bars: 96    # DEFAULT: trend-timeframe bars searched for swing levels
options:
  assumed_delta: 0.45        # G4: fixed, pessimistic delta until a greeks agent exists
# Theta (decay veto, decision B76-1): before an entry, the chosen option is valued with
# Black-76 at its implied volatility (solved from the quote's mid) now and at the end of
# the planned hold, in CALENDAR time; the difference is the modelled decay. Every value
# is a DRAFT default, untested on any data; Andre to confirm.
theta:
  planned_hold_minutes: 60      # DRAFT: decay is charged over this expected hold
  max_decay_pct_of_target: 25   # DRAFT: no entry when modelled decay over the hold, for
                                #   the sized contracts, is above this % of profit_target
  rate: 0.04                    # UNVERIFIED: annual rate for Black-76 discounting
  min_implied_vol: 0.05         # DRAFT hard danger: below this the quote is not believable
  max_implied_vol: 1.5          # DRAFT hard danger: extreme implied volatility, no entry
# Greeks vetoes (decision GV-1, Andre 2026-10-22): veto only, never scored. After Theta,
# each values the chosen option with Black-76 at the implied volatility of its mid
# (solved inside the vega band, at theta.rate, calendar time to its expiry moment) and
# blocks the entry only on its own hard danger; otherwise it is silent. Every value is
# a DRAFT default, untested on any data; Andre to confirm.
vega:
  min_implied_vol: 0.08         # DEFAULT (draft, Andre GV-1): below this the quote is not
                                #   believable; must sit inside theta's bounds
  max_implied_vol: 1.0          # DEFAULT (draft, Andre GV-1): extreme implied volatility
delta:
  min_abs_delta: 0.3            # DEFAULT (draft, Andre GV-1): a far out-of-the-money option
  max_abs_delta: 0.7            # DEFAULT (draft, Andre GV-1): a deep in-the-money option
gamma:
  min_hours_to_expiry: 6        # DEFAULT (draft, Andre GV-1): the danger zone near expiry;
                                #   no entry with less time than this to its expiry moment
zeroday:
  lookback_sessions: 20      # G9: "typical" = average of the same metric on these sessions
  trip_multiple: 4           # G9: range, volatility and price-jump tripwires
  volume_trip_multiple: 10   # DEVIATION from G9 (4x): a 4x volume bar is a normal momentum
                             # trigger, so 4x here would veto the strategy's own entries.
                             # Andre to confirm.
  recent_bars: 5             # DEFAULT: bar tripwires check each of the last N closed bars
  spike_bar_trip_multiple: 8 # DEFAULT: jump/volatility limit for the trigger's spike
                             # candle (the bar before the last); 4x would veto big
                             # spike candles, the strategy's own trigger
console:
  levels_weight: 2           # spec: levels count double
  range_weight: 1
  fire_threshold: 3          # spec: fire at >= +3; v1 scores only levels + range (max 3),
                             # so both must be positive (G13: measure trade count first)
  close_lead_minutes: 5      # DEFAULT (G8): no new entries in the last minutes of prime;
                             # trade management flattens from the same moment
