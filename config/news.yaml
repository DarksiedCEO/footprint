# News, opening-bell and Fed rules (Andre, 2026-10-14: N1-N9 in docs/decisions-pending.md).
# Every window below is a blackout: no new entries while it is in force, and a position
# held when it starts is closed through the normal exit path (the resting stop's cancel
# confirmed first, then a limit sell; never a market order). A window includes every
# second of its end minute. No rule depends on the weekday (N7): the daily windows apply
# to every calendar day, the FOMC window to the decision days in fomc.yaml.
# These windows are always on, in the backtest and live alike, on top of any
# --blackouts CSV (which keeps working as before).
timezone: America/New_York      # N1: release times are defined on the releases' own clock
lead_minutes: 5                 # N2 DEFAULT (Andre 2026-10-14): a daily window starts this
                                #   long before its event ...
lag_minutes: 2                  # N2 DEFAULT: ... and ends this long after it
# lead_minutes + lag_minutes must be shorter than one day (the loader refuses it).
# daily_events: N1 and N3, every day, news or not; never expire.
# time_stop (N-OPEN-2, PENDING-ANDRE, per window): true = an entry made in the first
# minutes after this window ends gets the news time stop (execution.yaml news:: closed
# after time_stop_minutes unless up time_stop_min_gain net); false = it does not.
#   (a) Built default (PENDING-ANDRE): true on every window and on pre_news_time_stop.
#   (b) 8:30 window only, every day: true on "8:30 ET releases (N1)", false on the
#       other two and on pre_news_time_stop.
#   (c) Release days only: false on all three and on pre_news_time_stop (the time stop
#       then follows only the --blackouts CSV windows and the overnight window).
#   Under the N-OPEN-1 default N4 refuses 08:33-08:45 ET entries, so (b) acts as (c)
#   unless N-OPEN-1 changes. Details: docs/decisions-pending.md, N-OPEN-2.
daily_events:
  - {name: "8:30 ET releases (N1)", at: "08:30", time_stop: true}   # 05:25-05:32 PT; jobless claims included
  - {name: "cash open (N3)", at: "09:30", time_stop: true}          # N3 DEFAULT 06:25-06:32 PT: flat into the open
  - {name: "10:00 ET releases (N1)", at: "10:00", time_stop: true}  # 06:55-07:02 PT
# N4 with N-OPEN-1 (DEFAULT, PENDING Andre): with N1 every day is a news day, so N4
# applies every day: no new entries from the prime session's start (04:00 PT) until
# this daily event's window ends (the latest morning release window, 10:02 ET). The
# window also closes anything held in it (none can be: overnight positions are flat by
# 03:59 PT). Fewest-entries reading; the alternative ("until the 8:30 window ends") is
# for Andre.
pre_news_until: "10:00 ET releases (N1)"
# N-OPEN-2 for the N4 window (PENDING-ANDRE; true in (a), false in (b) and (c)).
# N4 ends with the pre_news_until window, so while that window's own time_stop is true
# this switch changes nothing; it matters only if the two are set differently.
# With the play caller (no entries before 10:00 ET) the only one that bites today is the
# 10:00 ET window's: true gives every entry from 10:03:00 to 10:15:59 ET the time stop, every
# day. The overnight window (N-OPEN-3) and every --blackouts CSV window always carry it.
pre_news_time_stop: true
# N5 (Andre 2026-10-14): on an FOMC decision day, flat by this time (ET) and no new
# entries for the rest of the prime session (to its close, 14:00 PT or an early close).
fomc_flat_from: "13:55"         # N5 DEFAULT: 10:55 PT, before the 11:00 PT decision
fomc_warn_days: 30              # N6: alarm this many days before fomc.yaml's valid_through
# N-OPEN-3 (DEFAULT, PENDING Andre): the start of Andre's overnight flat window "... to
# 3:59 AM" did not come through. Fewest-entries reading: from the overnight session's
# own start (overnight_session.timezone), i.e. no new overnight entries at all and flat
# through it, to the overnight session's end. Moot today (max_trades_overnight is 0 and
# the play caller allows entries only in prime), so it costs nothing until those change.
overnight_flat_from: "15:00"
