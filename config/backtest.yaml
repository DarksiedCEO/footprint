# Backtest settings. Historical NQ OPTIONS data is not available, so option prices are
# MODELLED from the futures price (G4: fixed, pessimistic delta from strategy.yaml).
# Every option_model number is UNVERIFIED until checked against real NQ option quotes;
# the readout prints them beside the results so no result is read without them.
option_model:
  atm_premium_points: 150     # UNVERIFIED: an at-the-money option with 1 day to expiry
                              #   (time value shrinks with the square root of time left)
  spread_points: 2            # UNVERIFIED: bid/ask spread near the money (cost on every trade)
  strike_step: 25             # UNVERIFIED: strike spacing near the money
  strikes_each_side: 6        # strikes listed above and below the money
  open_interest: 500          # every modelled strike passes Felix's open-interest minimum
  expiries_listed: 5          # daily expiries listed ahead (Felix takes 1-3 days out)
  trading_class: Q3C          # the class modelled quotes carry: a daily (European) class
                              #   name; it must match the instrument's European patterns
  reference_price: 20000      # DEFAULT (draft, Andre BH-2): options are modelled as if the
                              #   future traded at this level. Each trade's futures moves are
                              #   rescaled by reference_price / (the futures price its entry
                              #   was decided at), so the fixed premium above means the same
                              #   in every year of a long history and a dollar result depends
                              #   only on the trade's percentage path. Strikes are listed at
                              #   this level; the bars the readers see are NOT rescaled; the
                              #   levels room N is converted to the data's level. null: no
                              #   rescaling (the model at the data's own price, as before)
engine:
  substep_seconds: 5          # the runner steps this often inside a minute while an entry
                              #   or a position is live (the minute's path is modelled
                              #   adverse-first: against an open trade, the bad extreme
                              #   comes before the good one)
  history_minutes: 43200      # 1-minute bars handed to each decision (~30 sessions; the
                              #   readers look back up to 20 sessions). The play caller's
                              #   regime reader needs more (61 sessions): the backtest hands
                              #   it its own source, every closed bar since the start of the
                              #   data (decisions-pending PC-2)
gates:                        # the go-live gates (work order, section 4)
  min_trades: 200
  min_win_rate_pct: 45
  min_payoff_ratio: 1.5
  min_profit_factor: 1.3
  max_drawdown_pct: 15
  out_of_sample_pct: 30       # DEFAULT: the last 30% of the trades (by time) are held out;
                              #   the gates must hold on them too
  min_out_of_sample_trades: 60  # DEFAULT: fewer held-out trades than this = not proven
rules:                        # Q5 backtest rule library (docs/strategy-rules.md); read by
                              #   the backtest only, never by the live runner
  stairstep:                  # Q5.2 "stairstep" / "stairstep_vol" (on 1-minute bars)
    steps: 3                  # APPROVED BY ANDRE 2026-10-10: three consecutive valid steps
    max_giveback: 0.5         # APPROVED BY ANDRE 2026-10-10: a pause gives back at most 50% of its push
    max_pause_bars: 10        # DEFAULT: accepted by Andre 2026-10-10 for backtest; revisit after real-data runs
    max_stair_bars: 60        # DEFAULT: accepted by Andre 2026-10-10 for backtest; revisit after real-data runs
  pullback:                   # Q5.3 "pullback" (on 1-minute bars)
    lifetime_minutes: 15      # DEFAULT: accepted by Andre 2026-10-10 for backtest; revisit after real-data runs
  time:                       # Q5.6 exit "time" (backtest only)
    minutes: 10               # APPROVED BY ANDRE 2026-10-10: judged this many minutes after the entry fill
    min_gain: 250             # APPROVED BY ANDRE 2026-10-10: open profit below this then closes the position
  bollinger:                  # Bollinger Band entries (docs/strategy-rules.md); backtest only.
                              #   APPROVED BY ANDRE 2026-10-17 (rule sheet); every number
                              #   below is a DEFAULT for him to confirm after real-data runs
    period: 20                # DEFAULT: bars in the middle line (simple moving average)
    width: 2                  # DEFAULT: standard deviations from the middle to each band
    fast_minutes: 1           # DEFAULT: bar length for the "_fast" rules (minutes)
    slow_minutes: 5           # DEFAULT: bar length for the "_slow" rules (minutes)
    squeeze_lookback: 120     # DEFAULT: a squeeze bar has the lowest bandwidth of this many bars
    squeeze_window: 10        # DEFAULT: bars after a squeeze in which the breakout may come
    walk_lookback: 10         # DEFAULT: bars before the touch counted for the walk
    walk_min_closes: 3        # DEFAULT: closes on or beyond the band needed in those bars
    walk_window: 10           # DEFAULT: bars after the touch in which the entry may come
    slope_bars: 5             # DEFAULT: middle line compared with this many bars ago
    bounce_window: 5          # DEFAULT: bars after the band touch in which the entry may come
rolls:                        # contract rolls in a RAW front-month history (BH-9)
  block_first_session: true   # DEFAULT (draft, Andre BH-9): no new entry on the trading day
                              #   whose session is the first on a new contract (the readers'
                              #   look-back then mixes two contracts: +112 to +259 points at
                              #   the 2022-09..2024-09 rolls, 1.6-2.4 N). A run must then say
                              #   which sessions those are (--rolls FILE, or --rolls none) or
                              #   it is refused. false: trade them. The alternative, back-
                              #   adjusting the look-back across the splice, is Andre's to
                              #   choose; it is not built
