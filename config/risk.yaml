# Money model. Amounts are in account currency.
bankroll: 25000
position_cap: 10000            # CAP-1 (Andre, 2026-10-23): was 5000. Mainly turns on
                               # Friday entries (3-day options); the dollar stop and loss
                               # limits are unchanged, but one trade's gap risk is now up to
                               # the cap. See docs/decisions-pending.md (CAP-1, M2, M3).
overnight_position_cap: 2500
profit_target: 1000
stop_min: 750
stop_max: 1000
stop_loss: 750            # G2: the hard stop, in option value, triggered on the BID
trail_keep_pct: 50        # G7: from +profit_target the stop locks, then trails at this
                          # share of the peak gain (50% of $1,000 = entry + $500)
max_contracts: 1          # Option A (decided Oct 4). Above 1 is refused: scale-out is
                          # not built in v1.
fee_per_contract_per_side: 2.5  # G15. UNVERIFIED estimate of IBKR commission + CME fees
                                # per NQ option contract per side; replace from IBKR.
daily_max_stopouts: 2
daily_max_loss: 2000
weekly_max_loss: 3500
kill_switch_drawdown_pct: 20
max_trades_prime: 4
max_trades_overnight: 0  # v1: no overnight trades (decided Oct 4, 2026)
