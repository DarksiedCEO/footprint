# FOMC meeting dates (N6, Andre 2026-10-14). Source: the Federal Reserve's own pages
# ONLY, never guessed; every entry names the federalreserve.gov page that confirms it:
#   2021-2027: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
#     ("Meeting calendars, statements, and minutes (2021-2027)", read 2026-10-26);
#     2027 also the Board's release of 2025-09-05 (monetary20250905a.htm)
#   2017-2020: https://www.federalreserve.gov/monetarypolicy/fomchistoricalYYYY.htm
#     (read 2026-10-26; BH-14: the history backtest starts in 2017), and the FOMC
#     press releases named on each intermeeting action below
# The policy statement comes at 2 p.m. ET on the second day of each regularly scheduled
# meeting (the decision day); N5 applies on the decision day.
#
# verified: false = UNVERIFIED. The Fed's page says of 2027: "Each meeting date is
# tentative until confirmed at the meeting immediately preceding it." Those dates are
# listed but not confirmed, so they are UNVERIFIED and the WHOLE decision day is a
# blackout (fail closed) until Andre sets verified: true after the Fed confirms each one.
#
# Not listed (accepted, N1-N9 notes): minutes, testimony, speeches, and any action not
# on the Fed's meeting pages. Intermeeting actions that are listed (unscheduled
# meetings, notation votes) are whole-day blackouts (`intermeeting`, below).
#
# FAIL CLOSED like the exchange calendar (D34): a day outside valid_from..valid_through
# is a blackout all day (no new entries; anything held is closed), live shows a critical
# "FOMC CALENDAR EXPIRED" alarm, and a backtest outside it is refused (before 2017:
# consistent with BH-14). Loading refuses a full calendar year in range without
# meetings_per_year meetings (scheduled plus cancelled).
source: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
