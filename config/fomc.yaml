# FOMC meeting dates (N6, Andre 2026-10-14). Source: the Federal Reserve's published
# meeting calendar ONLY, never guessed:
#   https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
#   ("Meeting calendars, statements, and minutes (2021-2027)", read 2026-10-26)
# and for 2027 the Board's press release of 2025-09-05:
#   https://www.federalreserve.gov/newsevents/pressreleases/monetary20250905a.htm
# The policy statement comes at 2 p.m. ET on the second day of each regularly scheduled
# meeting (the decision day); N5 applies on the decision day.
#
# verified: false = UNVERIFIED. The Fed's page says of 2027: "Each meeting date is
# tentative until confirmed at the meeting immediately preceding it." Those dates are
# listed but not confirmed, so they are UNVERIFIED and the WHOLE decision day is a
# blackout (fail closed) until Andre sets verified: true after the Fed confirms each one.
#
# Not listed (accepted, N1-N9 notes): unscheduled meetings and notation votes (the page
# shows a notation vote on 2025-08-22, not a meeting with a 2 p.m. statement), minutes,
# testimony and speeches.
#
# FAIL CLOSED like the exchange calendar (D34): a day outside valid_from..valid_through
# is a blackout all day (no new entries; anything held is closed), live shows a critical
# "FOMC CALENDAR EXPIRED" alarm, and a backtest outside it is refused. Loading refuses
# a full calendar year in range without meetings_per_year meetings. Years before 2021
# are not on that page (the Fed's historical pages, not read here): a history backtest
# before valid_from is refused until they are added from the Fed's own pages.
source: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
