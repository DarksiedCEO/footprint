# The exchange's standard closures by rule (D34): loading refuses a calendar that
# claims to be complete through calendar_through while one of these days is missing:
# a closed rule from holidays or no_trade_days (an early close does not count), an
# early_close rule from early_closes (or a closure). observed: weekend = Saturday -> Friday,
# Sunday -> Monday; not_saturday = Sunday -> Monday, a Saturday is not observed.
holiday_rules:
  - {name: "New Year's Day", month: 1, day: 1, observed: not_saturday}
  - {name: "Martin Luther King Jr. Day", month: 1, weekday: MON, nth: 3}
  - {name: "Presidents Day", month: 2, weekday: MON, nth: 3}
  - {name: "Good Friday", days_from_easter: -2}
  - {name: "Memorial Day", month: 5, weekday: MON, nth: -1}
  - {name: "Juneteenth", month: 6, day: 19, observed: weekend, first_year: 2022}  # DEFAULT (draft, Andre BH-1): first
    #   observed by the stock market and CME equity in 2022 (the data: June 19 was a full
    #   session before; 2022-06-20, 2023-06-19 and 2024-06-19 halted at 12:00 CT)
  - {name: "Independence Day", month: 7, day: 4, observed: weekend}
  - {name: "Labor Day", month: 9, weekday: MON, nth: 1}
  - {name: "Thanksgiving", month: 11, weekday: THU, nth: 4}
  - {name: "Day after Thanksgiving", kind: early_close, month: 11, weekday: THU, nth: 4, days_after: 1}
  # BH-1: the stock market's July 3 half day, only Monday to Thursday (on a Friday July 3
  # is the observed Independence Day; on a weekend there is none)
  - {name: "Independence Day eve", kind: early_close, month: 7, day: 3, observed: weekday_only, weekdays: [MON, TUE, WED, THU]}
  - {name: "Christmas Eve", kind: early_close, month: 12, day: 24, observed: weekday_only}
  - {name: "Christmas Day", month: 12, day: 25, observed: weekend}
# Easter Sunday of every year the calendar covers (for Good Friday); listed, not
# computed. Add the next year's when extending calendar_through.
easter_sundays: [2010-04-04, 2011-04-24, 2012-04-08, 2013-03-31, 2014-04-20, 2015-04-05,
                 2016-03-27, 2017-04-16, 2018-04-01, 2019-04-21, 2020-04-12, 2021-04-04,
                 2022-04-17, 2023-04-09, 2024-03-31, 2025-04-20, 2026-04-05, 2027-03-28]
# Spans in which the prime session ends at `close` (PT) on every trading day (BH-3): CME's
# daily equity maintenance halt, 15:15-15:30 CT (13:15-13:30 PT), was inside the prime
# session until 2021-06-25 (in the data, before 2021-06-28 no bar starts in 13:16-13:28 PT
# on any day, and 80 days have one single bar at the halt's edges, 76 at 13:15 and 4 at
# 13:29; from 2021-06-28 a bar starts in every minute of it); Fridays and the days before holidays closed
# at 15:15 CT outright until late 2012. Footprint ends the prime session at the halt: no
# position is held into it (the earlier close, as above). An earlier listed close wins.
early_close_periods:
  - {from: 2010-06-01, through: 2021-06-25, close: "13:15"}  # DEFAULT (draft, Andre BH-3)
calendar_from: 2010-06-01     # the lists above are complete from here (fixed: the check
                              #   never starts later because a year's dates were deleted).
                              #   DEFAULT (draft, Andre BH-1): back to the NQ history
calendar_through: 2027-03-31  # the lists above are complete up to here. FAIL CLOSED:
                              #   every later day is treated as closed until extended
calendar_warn_days: 30        # alarm this many days before calendar_through
