# Instrument profile: E-mini S&P 500 futures (ES), for RESEARCH ONLY (noiseband-es-v1,
# docs/research/noiseband-es-v1.md). Same schema as nq.yaml. The research harness reads
# only `symbol` (the bar reader's label) and `point_value` from this file; every other
# value is here only because the profile loader requires the full schema, does not
# affect a research run, and is UNVERIFIED for ES. Nothing on the trading path loads
# this file (the live and paper runs use nq.yaml). Sources per value below.
symbol: ES                   # CME contract code
exchange: CME                # CME Group (the exchange ES lists on)
currency: USD
point_value: 50              # $50 per index point: the signed pre-registration (CME ES spec)
tick_size: 0.25              # 0.25 index points: the signed pre-registration (CME ES spec)
round_number_step: 50        # UNVERIFIED (not used by research): a guess at ES round levels
prime_session:
  start: "04:00"
  end: "14:00"
  timezone: America/Los_Angeles
overnight_session:
  start: "15:00"
  end: "03:59"
  timezone: America/Los_Angeles
# UNVERIFIED for ES (not used by research): the sessions are copied from nq.yaml (CME
# equity index futures share their trading hours).
# Regular cash session. Anchors VWAP, prior-day levels and daily bars (G10, G11).
cash_session:
  start: "06:30"
  end: "13:00"
  timezone: America/Los_Angeles
# Minimum price increment of the option premium, in index points.
# UNVERIFIED for ES (not used by research): copied from nq.yaml; check CME's ES options
# specs (they may tick finer at low premiums).
option_tick_size: 0.25
dte_min: 1                   # UNVERIFIED for ES (not used by research): nq.yaml's values
dte_max: 3
# Days the PRIME session trades. Each OVERNIGHT session belongs to the next
# trading day (it opens the evening before), so Friday evening and weekends
# are closed.
trading_days: [MON, TUE, WED, THU, FRI]
# UNVERIFIED for ES (not used by research): the calendar below is copied from nq.yaml
# (CME equity index futures share one holiday calendar); same caveats.
# The exchange calendar (D34). Full-day closures: no prime session that day, and the
# overnight session leading into it is closed too.
# UNVERIFIED against CME's own 2026/27 trading-hours pages (they load interactively);
# built from CME's published pattern (equity futures halt 12:00 CT on US holidays,
# close 12:15 CT the day after Thanksgiving and on Christmas Eve) and two futures-broker
# calendars. Where sources disagree, the EARLIER close is used: a too-early close never
# leaves a position held over a holiday (it costs trading time, and shortens the next
# day's prior-session levels). Dates go on the weekday the exchange observes them; the
# loader refuses a weekend date or a date given twice. Verify at cmegroup.com (paper
# checklist 23).
holidays:
  - 2026-01-01   # New Year's Day
  - 2026-04-03   # Good Friday
  - 2026-12-25   # Christmas Day
  - 2027-01-01   # New Year's Day
  - 2027-03-26   # Good Friday
# Early closes: the prime session ends at this time (prime_session timezone, PT) on
# that date; no new entries and everything flat close_lead_minutes before it.
early_closes:
  2026-01-19: "10:00"   # Martin Luther King Jr. Day: 12:00 CT halt
  2026-02-16: "10:00"   # Presidents Day: 12:00 CT halt
  2026-05-25: "10:00"   # Memorial Day: 12:00 CT halt
  2026-06-19: "10:00"   # Juneteenth: 12:00 CT halt
  2026-07-03: "10:00"   # Independence Day (observed): 12:00 CT halt
  2026-09-07: "10:00"   # Labor Day: 12:00 CT halt
  2026-11-26: "10:00"   # Thanksgiving: 12:00 CT halt (one source says closed all day)
  2026-11-27: "10:00"   # day after Thanksgiving: 12:15 CT per most sources; 12:00 per one
  2026-12-24: "10:00"   # Christmas Eve: 12:15 CT per most sources; 12:00 per one
  2027-01-18: "10:00"   # Martin Luther King Jr. Day: 12:00 CT halt (CME pattern)
  2027-02-15: "10:00"   # Presidents Day: 12:00 CT halt (CME pattern)
# No-trade days (Andre, remediation item 8): US-holiday sessions. The exchange is open
# (a short futures-only session, early close above) but the stock market is closed:
# Footprint treats them as CLOSED (no session, no entry, never the "prior day") until
# they are separately reviewed and explicitly approved.
no_trade_days:
  - 2026-01-19   # Martin Luther King Jr. Day
  - 2026-02-16   # Presidents Day
  - 2026-05-25   # Memorial Day
  - 2026-06-19   # Juneteenth
  - 2026-07-03   # Independence Day (observed)
  - 2026-09-07   # Labor Day
  - 2026-11-26   # Thanksgiving
  - 2027-01-18   # Martin Luther King Jr. Day
  - 2027-02-15   # Presidents Day
# The exchange's standard closures by rule (D34): loading refuses a calendar that
# claims to be complete through calendar_through while one of these days is missing:
# a closed rule from holidays or no_trade_days (an early close does not count), an
# early_close rule from early_closes (or a closure). observed: weekend = Saturday -> Friday,
# Sunday -> Monday; not_saturday = Sunday -> Monday, a Saturday is not observed.
holiday_rules:
  - {name: "New Year's Day", month: 1, day: 1, observed: not_saturday}
  - {name: "Martin Luther King Jr. Day", month: 1, weekday: MON, nth: 3}
  - {name: "Presidents Day", month: 2, weekday: MON, nth: 3}
  - {name: "Good Friday", days_from_easter: -2}
  - {name: "Memorial Day", month: 5, weekday: MON, nth: -1}
  - {name: "Juneteenth", month: 6, day: 19, observed: weekend}
  - {name: "Independence Day", month: 7, day: 4, observed: weekend}
  - {name: "Labor Day", month: 9, weekday: MON, nth: 1}
  - {name: "Thanksgiving", month: 11, weekday: THU, nth: 4}
  - {name: "Day after Thanksgiving", kind: early_close, month: 11, weekday: THU, nth: 4, days_after: 1}
  - {name: "Christmas Eve", kind: early_close, month: 12, day: 24, observed: weekday_only}
  - {name: "Christmas Day", month: 12, day: 25, observed: weekend}
# Easter Sunday of every year the calendar covers (for Good Friday); listed, not
# computed. Add the next year's when extending calendar_through.
easter_sundays: [2026-04-05, 2027-03-28]
calendar_from: 2026-01-01     # the lists above are complete from here (fixed: the check
                              #   never starts later because a year's dates were deleted)
calendar_through: 2027-03-31  # the lists above are complete up to here. FAIL CLOSED:
                              #   every later day is treated as closed until extended
calendar_warn_days: 30        # alarm this many days before calendar_through
